<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - North Star Bakery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Get in Touch</h2>
        <p>Have a question or want to place a custom order? Send us a message!</p>
        
        <!-- NEW: Added id="contactForm" to the form -->
        <form id="contactForm" action="#" method="POST">
            <div>
                <label for="nameInput">Name:</label><br>
                <input type="text" id="nameInput" name="name" required>
            </div>
            <br>
            <div>
                <label for="emailInput">Email:</label><br>
                <!-- NEW: Added id="emailInput" and an error span -->
                <input type="text" id="emailInput" name="email">
                <span id="emailError" style="color: red; display: block; font-size: 0.9em;"></span>
            </div>
            <br>
            <div>
                <label for="messageInput">Message:</label><br>
                <!-- NEW: Added id="messageInput" and an error span -->
                <textarea id="messageInput" name="message" rows="4"></textarea>
                <span id="messageError" style="color: red; display: block; font-size: 0.9em;"></span>
            </div>
            <br>
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 North Star Bakery</p>
    </footer>

    <!-- NEW: Link to your JavaScript file just before the closing body tag -->
    <script src="script.js"></script>
</body>
</html>
