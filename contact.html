<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - North Star Bakery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Contact & Pre-Orders</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Inquiries and Requests</h2>
        <p>Visit us at 123 Main St, open Tuesday - Sunday, 6:00 AM - 2:00 PM, or fill out the form below.</p>
 
        <form action="/submit" method="POST">
            <fieldset>
                <legend>Order & Inquiry Details</legend>
                
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <br>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
 
                <label for="pickup">Pickup Date:</label>
                <input type="date" id="pickup" name="pickup" required>
                <br>
 
                <label for="requestType">Request Type:</label>
                <select id="requestType" name="requestType">
                    <option value="pre-order">Pre-order</option>
                    <option value="general">General Question</option>
                </select>
                <br>
                
                <label for="details">Item Details:</label>
                <textarea id="details" name="details" required></textarea>
                <br>
 
                <label for="allergies">Allergy Notes (if applicable):</label>
                <textarea id="allergies" name="allergies"></textarea>
                <br>
                
                <button type="submit">Submit</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 North Star Bakery</p>
    </footer>
</body>
</html>
